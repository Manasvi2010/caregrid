<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareGrid | Real-Time Bed Management</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">CareGrid</div>
    <div class="right">
      <span id="live" class="live off">Connecting...</span>
      <span id="who"></span>
      <button id="logoutBtn">Log out</button>
    </div>
  </div>

  <main>
    <div class="controls">
      <select id="wardSelect" aria-label="Choose ward"></select>
      <button id="refreshBtn">Refresh</button>
    </div>

    <div id="summary" class="summary"></div>

    <div class="legend">
      <span style="--c: var(--available)">Available</span>
      <span style="--c: var(--occupied)">Occupied</span>
      <span style="--c: var(--cleaning)">Cleaning</span>
      <span style="--c: var(--reserved)">Reserved</span>
    </div>

    <div id="grid" class="grid"></div>
  </main>

  <div id="overlay" class="overlay">
    <div class="modal">
      <h2 id="modalTitle"></h2>
      <p id="modalSub"></p>
      <div id="options"></div>

      <div id="admitForm" class="hidden">
        <label for="pName">Patient name</label>
        <input id="pName" type="text" maxlength="100">
        <label for="pAge">Age</label>
        <input id="pAge" type="number" min="0" max="120">
        <label for="pGender">Gender</label>
        <select id="pGender">
          <option value="">Not specified</option>
          <option>Female</option>
          <option>Male</option>
          <option>Other</option>
        </select>
        <button id="admitBtn" class="opt occupied" style="margin-top:12px">Admit patient</button>
      </div>

      <div id="transferForm" class="hidden">
        <label for="targetBed">Move patient to</label>
        <select id="targetBed"></select>
        <button id="transferBtn" class="opt reserved" style="margin-top:12px">Transfer patient</button>
      </div>

      <button id="cancelBtn" class="opt cancel">Cancel</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/socket.js"></script>
</body>
</html>
