services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: caregrid
      POSTGRES_PASSWORD: caregrid
      POSTGRES_DB: caregrid
    volumes:
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caregrid -d caregrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://caregrid:caregrid@db:5432/caregrid
      SECRET_KEY: dev-only-secret-change-me
    depends_on:
      db:
        condition: service_healthy